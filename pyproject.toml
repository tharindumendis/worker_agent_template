# =============================================================================
# pyproject.toml — Build system & tool configuration for Worker Agent Template
# =============================================================================
# Uses hatchling as the build backend for uv/uvx compatibility.
# All metadata and dependencies are declared inline — no setup.py needed.
# =============================================================================

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name            = "worker-agent"
version         = "1.0.8"
description     = "A config-driven, plug-and-play worker agent template built on LangGraph + FastMCP."
readme          = "README.md"
license         = "MIT"
requires-python = ">=3.10"
authors         = [{ name = "Tharindumendis" }]
keywords        = [
    "agent", "worker-agent", "langgraph", "langchain",
    "mcp", "fastmcp", "ollama", "llm", "react-agent", "autonomous-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    # Core LangChain + LangGraph
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-community>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-aws>=0.2.0",
    "langgraph>=0.2.0",
    # MCP SDK (server + client)
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    # LangChain → MCP tool adapter
    "langchain-mcp-adapters>=0.1.0",
    # Config / utilities
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "mcp_server_shell>=0.1.0",
]

# Console script installed into the venv's Scripts/ directory
[project.scripts]
worker-agent = "main:_cli_entry"

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "pre-commit>=3.0",
]
release = [
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Source        = "https://github.com/tharindumendis/worker_agent_template"
"Bug Tracker" = "https://github.com/tharindumendis/worker_agent_template/issues"
Documentation = "https://github.com/tharindumendis/worker_agent_template#readme"

# ---------------------------------------------------------------------------
# Hatch build config
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["core"]

# Root-level .py files must use force-include to be importable in the wheel
[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"sample_main_agent.py" = "sample_main_agent.py"
"config.yaml" = "config.yaml"
"py.typed" = "py.typed"

[tool.hatch.build.targets.sdist]
include = [
    "core/",
    "main.py",
    "sample_main_agent.py",
    "config.yaml",
    "py.typed",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8, isort, pyupgrade, etc.)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length    = 100
src            = [".", "core"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.ruff.format]
quote-style    = "double"
indent-style   = "space"

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version          = "3.10"
strict                  = false
warn_return_any         = true
warn_unused_configs     = true
warn_unused_ignores     = true
disallow_untyped_defs   = true
ignore_missing_imports  = true
exclude                 = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module            = ["langchain.*", "langgraph.*", "mcp.*", "fastmcp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode     = "auto"
testpaths        = ["tests"]
addopts          = "-v --tb=short"
log_cli          = true
log_cli_level    = "INFO"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source  = ["core", "main"]
omit    = [".venv/*", "tests/*", "sample_main_agent.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
