# =============================================================================
# pyproject.toml — Build system & tool configuration for Worker Agent Template
# =============================================================================
# This file declares:
#   1. The build backend (setuptools) — required by PEP 517/518
#   2. Ruff linting + formatting rules
#   3. mypy static type-checking settings
#   4. pytest settings
# =============================================================================

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata (mirrors setup.py; setuptools reads EITHER place)
# This section is intentionally light — setup.py remains the single source
# of truth for version and dependency lists so they stay DRY.
# ---------------------------------------------------------------------------
[project]
name            = "worker-agent"
requires-python = ">=3.10"
dynamic         = ["version", "description", "readme", "license", "authors",
                   "keywords", "classifiers", "dependencies"]

# Console script installed into the venv's Scripts/ directory
[project.scripts]
worker-agent = "main:_cli_entry"

# Optional dependency groups
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "types-PyYAML",
    "pre-commit>=3.0",
]
release = [
    "build>=1.0",
    "twine>=5.0",
]


# ---------------------------------------------------------------------------
# Ruff — linting + formatting (replaces flake8, isort, pyupgrade, etc.)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length    = 100
src            = [".", "core"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["core"]

[tool.ruff.format]
quote-style    = "double"
indent-style   = "space"

# ---------------------------------------------------------------------------
# mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version          = "3.10"
strict                  = false
warn_return_any         = true
warn_unused_configs     = true
warn_unused_ignores     = true
disallow_untyped_defs   = true
ignore_missing_imports  = true   # many MCP/LangChain stubs are incomplete
exclude                 = ["^\\.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module            = ["langchain.*", "langgraph.*", "mcp.*", "fastmcp.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode     = "auto"          # pytest-asyncio: all async tests auto
testpaths        = ["tests"]
addopts          = "-v --tb=short"
log_cli          = true
log_cli_level    = "INFO"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source  = ["core", "main"]
omit    = [".venv/*", "tests/*", "sample_main_agent.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
